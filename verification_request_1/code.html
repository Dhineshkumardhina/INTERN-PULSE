<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GPS Verification Required</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#002109",
                        "tertiary-container": "#006129",
                        "on-primary-fixed-variant": "#004881",
                        "tertiary-fixed": "#6bff8f",
                        "error-container": "#ffdad6",
                        "secondary": "#006a6a",
                        "on-tertiary-fixed-variant": "#005321",
                        "outline": "#727781",
                        "on-surface": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "on-error-container": "#93000a",
                        "on-background": "#0b1c30",
                        "surface-tint": "#1b60a2",
                        "inverse-surface": "#213145",
                        "on-secondary-fixed-variant": "#004f4f",
                        "background": "#f8f9ff",
                        "inverse-primary": "#a2c9ff",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#001c38",
                        "inverse-on-surface": "#eaf1ff",
                        "outline-variant": "#c1c7d2",
                        "on-secondary-fixed": "#002020",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-container": "#007070",
                        "tertiary": "#00471c",
                        "primary-fixed": "#d3e4ff",
                        "error": "#ba1a1a",
                        "on-primary-container": "#a4caff",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-container": "#4ce277",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#005596",
                        "tertiary-fixed-dim": "#4ae176",
                        "secondary-container": "#8cf3f3",
                        "surface": "#f8f9ff",
                        "secondary-fixed-dim": "#6fd7d6",
                        "surface-dim": "#cbdbf5",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#8cf3f3",
                        "on-primary": "#ffffff",
                        "primary": "#003e6f",
                        "surface-container": "#e5eeff",
                        "on-surface-variant": "#414750",
                        "primary-fixed-dim": "#a2c9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "card-padding": "16px",
                        "inline-gap": "8px",
                        "container-padding": "16px",
                        "unit": "4px",
                        "stack-gap": "12px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-id": ["Inter"],
                        "headline-lg": ["Inter"],
                        "status-badge": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-id": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "status-badge": ["12px", { "lineHeight": "12px", "fontWeight": "600" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .ring-pulse-1 { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .ring-pulse-2 { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 0.3s; }
        .ring-pulse-3 { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0; transform: scale(1.5); }
        }
        
        .timer-progress {
            transition: width 1s linear;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-md">
<!-- Top Navigation (Suppressed based on Semantic Shell Mandate for Transactional/Urgent screens) -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-container-padding relative">
<!-- Background Blur/Overlay -->
<div class="absolute inset-0 bg-surface-variant/80 backdrop-blur-sm z-0"></div>
<!-- Verification Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl w-full max-w-md shadow-md z-10 flex flex-col overflow-hidden">
<!-- Urgent Header Bar -->
<div class="bg-error text-on-error px-card-padding py-3 flex items-center justify-center gap-inline-gap">
<span class="material-symbols-outlined" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">ACTION REQUIRED</span>
</div>
<div class="p-card-padding flex flex-col items-center text-center">
<!-- GPS Visual -->
<div class="relative w-32 h-32 my-6 flex items-center justify-center">
<div class="absolute w-full h-full border-2 border-primary rounded-full ring-pulse-1 opacity-20"></div>
<div class="absolute w-24 h-24 border-2 border-primary rounded-full ring-pulse-2 opacity-40"></div>
<div class="absolute w-16 h-16 border-2 border-primary rounded-full ring-pulse-3 opacity-60"></div>
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center z-10 shadow-md">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="location_on" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Text Content -->
<h1 class="font-display-id text-display-id text-on-surface mb-2">GPS VERIFICATION REQUIRED</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-6 px-4">
                    Please confirm your location within the next 2 minutes to maintain compliance with shift protocols.
                </p>
<!-- Timer -->
<div class="w-full bg-surface-container-high rounded-full h-2 mb-2 overflow-hidden">
<div class="bg-primary h-full timer-progress" id="countdown-bar" style="width: 75%;"></div>
</div>
<div class="font-status-badge text-status-badge text-primary mb-8" id="countdown-text">01:30</div>
<!-- Actions -->
<button class="w-full bg-primary text-on-primary h-12 rounded-full font-headline-md text-headline-md flex items-center justify-center gap-2 mb-4 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm active:shadow-md">
<span class="material-symbols-outlined" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
                    VERIFY NOW
                </button>
<button class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant hover:decoration-primary underline-offset-4">
                    I am having technical issues
                </button>
</div>
</div>
</main>
<script>
        // Simple countdown logic for visual effect
        let timeLeft = 120; // 2 minutes in seconds
        const bar = document.getElementById('countdown-bar');
        const text = document.getElementById('countdown-text');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                clearInterval(timer);
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            text.textContent = `0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            bar.style.width = `${(timeLeft / 120) * 100}%`;
            
            // Turn red if urgent (under 30s)
            if(timeLeft < 30) {
                bar.classList.remove('bg-primary');
                bar.classList.add('bg-error');
                text.classList.remove('text-primary');
                text.classList.add('text-error');
            }

        }, 1000);
    </script>
</body></html>
