<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GPS Verification Result - InternTrack</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#007070",
                        "inverse-surface": "#213145",
                        "on-primary-fixed": "#001c38",
                        "on-background": "#0b1c30",
                        "secondary-container": "#8cf3f3",
                        "outline": "#727781",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface": "#0b1c30",
                        "surface": "#f8f9ff",
                        "tertiary-container": "#006129",
                        "primary": "#003e6f",
                        "on-secondary-fixed-variant": "#004f4f",
                        "on-surface-variant": "#414750",
                        "surface-variant": "#d3e4fe",
                        "surface-tint": "#1b60a2",
                        "outline-variant": "#c1c7d2",
                        "secondary-fixed-dim": "#6fd7d6",
                        "on-tertiary-fixed": "#002109",
                        "on-primary-fixed-variant": "#004881",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#002020",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#005321",
                        "on-error-container": "#93000a",
                        "primary-container": "#005596",
                        "surface-container": "#e5eeff",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "background": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "secondary": "#006a6a",
                        "on-tertiary-container": "#4ce277",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#8cf3f3",
                        "tertiary-fixed": "#6bff8f",
                        "error": "#ba1a1a",
                        "surface-container-low": "#eff4ff",
                        "primary-fixed-dim": "#a2c9ff",
                        "primary-fixed": "#d3e4ff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#4ae176",
                        "inverse-primary": "#a2c9ff",
                        "tertiary": "#00471c",
                        "on-primary-container": "#a4caff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "inline-gap": "8px",
                        "card-padding": "16px",
                        "stack-gap": "12px",
                        "container-padding": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "status-badge": ["Inter"],
                        "display-id": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "status-badge": ["12px", { "lineHeight": "12px", "fontWeight": "600" }],
                        "display-id": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .pulse-ring-2 {
            animation: pulse-delayed 2s infinite;
            animation-delay: 0.5s;
        }
        @keyframes pulse-delayed {
            0% { transform: scale(1.2); opacity: 0.5; }
            50% { transform: scale(1.8); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional Screen - No Navigation Shell -->
<!-- TopAppBar for contextual action -->
<header class="flex justify-between items-center w-full px-container-padding h-12 z-50 bg-surface border-b border-outline-variant/30">
<div class="flex items-center gap-inline-gap">
<button class="p-2 text-primary hover:bg-surface-container-low transition-colors duration-200 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<div class="font-headline-md text-headline-md text-primary">GPS Verification</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-padding py-8 max-w-md mx-auto w-full">
<!-- Verification Graphic -->
<div class="relative w-48 h-48 mb-8 flex items-center justify-center">
<!-- Concentric pulsating rings -->
<div class="absolute inset-0 border-4 border-tertiary rounded-full pulse-ring-2 opacity-50"></div>
<div class="absolute inset-4 border-4 border-tertiary rounded-full pulse-ring opacity-80"></div>
<!-- Central Icon Container -->
<div class="relative z-10 w-24 h-24 bg-tertiary rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[48px] text-on-tertiary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Small map pin badge -->
<div class="absolute bottom-4 right-8 z-20 w-10 h-10 bg-surface rounded-full flex items-center justify-center border-2 border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Result Text -->
<div class="text-center mb-8">
<h1 class="font-display-id text-display-id text-tertiary mb-2">VERIFIED</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Location successfully verified.</p>
</div>
<!-- Details Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding mb-8 flex flex-col gap-stack-gap">
<div class="flex justify-between items-center py-2 border-b border-outline-variant/30">
<div class="flex items-center gap-inline-gap text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">schedule</span>
<span class="font-body-md text-body-md">Timestamp</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">01:18 AM</span>
</div>
<div class="flex justify-between items-center py-2 border-b border-outline-variant/30">
<div class="flex items-center gap-inline-gap text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">straighten</span>
<span class="font-body-md text-body-md">Distance</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">45m</span>
</div>
<div class="flex justify-between items-center py-2">
<div class="flex items-center gap-inline-gap text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">my_location</span>
<span class="font-body-md text-body-md">Status</span>
</div>
<span class="font-status-badge text-status-badge px-2 py-1 bg-tertiary/10 text-tertiary rounded">Inside Geofence</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-4 mt-auto">
<button class="w-full h-12 bg-primary text-on-primary font-headline-md text-headline-md rounded-full flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors active:shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
                Back to Dashboard
            </button>
<button class="w-full h-12 border border-outline text-primary font-headline-md text-headline-md rounded-full flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
                View GPS History
            </button>
</div>
</main>
</body></html>
