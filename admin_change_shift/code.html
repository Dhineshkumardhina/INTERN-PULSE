<div class="p-4 rounded-lg border border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:border-2 peer-checked:bg-surface-container-low transition-all">

<div class="w-4 h-4 rounded-full border border-outline-variant peer-checked:border-primary peer-checked:border-4"></div>
</div>
<div class="font-headline-md text-headline-md text-on-surface">Day</div>
<div class="font-body-md text-body-md text-on-surface-variant">08:00 AM - 04:00 PM</div>
</div>
</label>
<!-- Evening Shift -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="newShift" type="radio" value="evening"/>

</div>

</div>
</label>

<div class="p-4 rounded-lg border border-outline-variant bg-surface-container-lowest transition-all">
<div class="flex items-center justify-between mb-2">
