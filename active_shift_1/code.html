<style>
        .pulse-ring {
            animation: pulse 2s infinite;
        }
        .pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }
        .pulse-ring:nth-child(3) {
            animation-delay: 1s;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .verified-color {
            border-color: #006129; /* tertiary-container mapping */
        }
    </style>

<div class="relative w-16 h-16 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-2 verified-color pulse-ring"></div>
<div class="absolute inset-0 rounded-full border-2 verified-color pulse-ring"></div>
<div class="absolute inset-0 rounded-full border-2 verified-color pulse-ring"></div>
<span class="material-symbols-outlined text-4xl text-tertiary-container bg-surface-container-lowest dark:bg-inverse-surface rounded-full p-2 z-20 shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<p class="mt-4 font-headline-md text-headline-md text-tertiary-container bg-surface-container-low/80 dark:bg-surface-dim/80 px-4 py-1 rounded-full backdrop-blur-sm">Inside Geofence</p>
</div>
</div>
<div class="text-center mb-6">
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant">Next Verification</p>

</div>
<!-- Stats Grid -->
