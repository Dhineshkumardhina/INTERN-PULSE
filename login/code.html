<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>InternTrack - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#002109",
                        "tertiary-container": "#006129",
                        "on-primary-fixed-variant": "#004881",
                        "tertiary-fixed": "#6bff8f",
                        "error-container": "#ffdad6",
                        "secondary": "#006a6a",
                        "on-tertiary-fixed-variant": "#005321",
                        "outline": "#727781",
                        "on-surface": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "on-error-container": "#93000a",
                        "on-background": "#0b1c30",
                        "surface-tint": "#1b60a2",
                        "inverse-surface": "#213145",
                        "on-secondary-fixed-variant": "#004f4f",
                        "background": "#f8f9ff",
                        "inverse-primary": "#a2c9ff",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#001c38",
                        "inverse-on-surface": "#eaf1ff",
                        "outline-variant": "#c1c7d2",
                        "on-secondary-fixed": "#002020",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-container": "#007070",
                        "tertiary": "#00471c",
                        "primary-fixed": "#d3e4ff",
                        "error": "#ba1a1a",
                        "on-primary-container": "#a4caff",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-container": "#4ce277",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#005596",
                        "tertiary-fixed-dim": "#4ae176",
                        "secondary-container": "#8cf3f3",
                        "surface": "#f8f9ff",
                        "secondary-fixed-dim": "#6fd7d6",
                        "surface-dim": "#cbdbf5",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#8cf3f3",
                        "on-primary": "#ffffff",
                        "primary": "#003e6f",
                        "surface-container": "#e5eeff",
                        "on-surface-variant": "#414750",
                        "primary-fixed-dim": "#a2c9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "card-padding": "16px",
                        "inline-gap": "8px",
                        "container-padding": "16px",
                        "unit": "4px",
                        "stack-gap": "12px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-id": ["Inter"],
                        "headline-lg": ["Inter"],
                        "status-badge": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-id": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "status-badge": ["12px", { "lineHeight": "12px", "fontWeight": "600" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Transactional Screen: Navigation suppressed -->
<main class="w-full max-w-md">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-24 h-24 mb-4 rounded-xl overflow-hidden shadow-sm bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center">
<img alt="InternTrack Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyO80O4qfSvHzx1XrkZuOxcbASW_FV1a71q34IveMK7VGkJTu_IkTLyp0x0jVBDw1G98ZYYq9R2S7GLJh3I9R9VSuWLMzdy_6nM2-sSc9-ONS8arfxVvUR-ZUx7-cBJaA6eOAy6DYxsgQdXb4NXEqqWAss6S_rXDBmfw9KGCNmLjU1J40d3p0KRtbKh6VMqmiI9PZ3qtjdxV1rAvwI-pEaGqY9DFAebFJHZc_B-IXLlpXMiBciZsE">
</div>
<h1 class="font-display-id text-display-id text-on-surface text-center">InternTrack</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Secure Clinical Access</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-card-padding shadow-sm">
<form action="#" class="flex flex-col gap-stack-gap" method="POST">
<!-- Register Number Input -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit" for="registerNumber">Register Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant">badge</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors min-h-[48px]" id="registerNumber" name="registerNumber" placeholder="e.g. 23BHS001" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors min-h-[48px]" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1 mb-2">
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary rounded-full py-3 font-headline-md text-headline-md hover:bg-primary-container transition-colors min-h-[48px] flex items-center justify-center shadow-sm active:shadow-none active:scale-[0.98]" type="submit">
                    Login
                </button>
</form>
</div>
<!-- Trust Indicator -->
<div class="mt-8 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">enhanced_encryption</span>
<span class="font-label-caps text-label-caps">End-to-End Encrypted</span>
</div>
</main>
</body></html>
